
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồng Quân Giải BT Tin</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;color:white;
  background:linear-gradient(135deg,#071b42,#073b72,#087fba)
}
.card{
  width:100%;max-width:480px;padding:25px;
  background:#07152bea;border:1px solid #31c5ff;
  border-radius:20px;box-shadow:0 0 25px #00baff66
}
h1{text-align:center;color:#55d5ff;margin-top:0}
p{text-align:center;color:#c5eaff}
label{display:block;margin:15px 0 7px;font-weight:bold}
input,textarea{
  width:100%;padding:13px;border-radius:10px;
  border:1px solid #39bfff;background:#10294b;
  color:white;font-size:16px
}
button{
  width:100%;margin-top:20px;padding:14px;
  border:0;border-radius:12px;
  background:linear-gradient(90deg,#00aaff,#16e0c2);
  color:#00152a;font-size:17px;font-weight:bold;
  cursor:pointer
}
button:disabled{opacity:.5}
#status{text-align:center;margin-top:15px;min-height:22px}
.links{display:flex;gap:10px;margin-top:15px}
.links a{
  flex:1;text-align:center;padding:11px 5px;
  border-radius:9px;background:#123c60;
  color:#75dcff;text-decoration:none;font-size:14px
}
.small{font-size:12px;color:#a9cbe0;text-align:center}
</style>
</head>
<body>
<main class="card">
  <h1>📘 Hồng Quân Giải BT Tin</h1>
  <p>Điền thông tin để gửi yêu cầu</p>

  <form id="form">
    <label for="ten">Tên tài khoản</label>
    <input id="ten" name="tenTaiKhoan" required
      placeholder="Nhập tên tài khoản">

    <label for="key">KEY AD</label>
    <input id="key" name="thanhToan" required
      placeholder="Nhập KEY AD" autocomplete="off">

    <label for="bai">Nội dung cần giải</label>
    <textarea id="bai" name="bai" rows="4" required
      placeholder="Nhập bài tập hoặc yêu cầu"></textarea>

    <label for="ghichu">Ghi chú (không bắt buộc)</label>
    <textarea id="ghichu" name="ghiChu" rows="2"
      placeholder="Ghi chú thêm"></textarea>

    <button id="submit" type="submit">📨 Gửi yêu cầu</button>
  </form>

  <div id="status" role="status"></div>

  <div class="links">
    <a href="https://docs.google.com/spreadsheets/d/1-FpNmH8e8U5uaRZF1RvBOMQ1GH7Bg7K2RKsyMO3Nt5A/edit?usp=drivesdk"
       target="_blank" rel="noopener">📊 Google Sheets</a>
    <a href="https://script.google.com/macros/s/AKfycbyH3b5bnohW0v0qafJ-4VhFTmm3DXFqDycPkGruOz9nPy1Po0xhpR9hp935q_HUooZ9/exec"
       target="_blank" rel="noopener">🔗 Apps Script</a>
  </div>

  <p class="small">
    Không nhập mật khẩu, mã OTP hoặc thông tin bí mật cá nhân.
  </p>
</main>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyH3b5bnohW0v0qafJ-4VhFTmm3DXFqDycPkGruOz9nPy1Po0xhpR9hp935q_HUooZ9/exec";

const form = document.getElementById("form");
const statusBox = document.getElementById("status");
const submitBtn = document.getElementById("submit");

form.addEventListener("submit", async function(event){
  event.preventDefault();

  const data = {
    tenTaiKhoan: form.tenTaiKhoan.value.trim(),
    thanhToan: form.thanhToan.value.trim(),
    bai: form.bai.value.trim(),
    ghiChu: form.ghiChu.value.trim()
  };

  if(!data.tenTaiKhoan || !data.thanhToan || !data.bai){
    statusBox.textContent = "Vui lòng điền đủ thông tin.";
    statusBox.style.color = "#ffca66";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Đang gửi...";
  statusBox.textContent =
    "Đang kiểm tra KEY và gửi yêu cầu...";
  statusBox.style.color = "#c5eaff";

  try{
    // Gửi đến máy chủ. no-cors không cho trình duyệt
    // đọc nội dung phản hồi, nên không thể xác nhận
    // KEY hợp lệ chỉ từ phản hồi này.
    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(data)
    });

    statusBox.textContent =
      "Đã gửi yêu cầu. Hãy kiểm tra Google Sheets để xác nhận.";
    statusBox.style.color = "#6dffb0";
    form.reset();
  }catch(error){
    statusBox.textContent =
      "Không gửi được. Kiểm tra kết nối hoặc cấu hình Apps Script.";
    statusBox.style.color = "#ff7777";
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = "📨 Gửi yêu cầu";
  }
});
</script>
</body>
</html>
