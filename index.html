
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồng Quân - Đăng nhập</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;
  font-family:Arial,sans-serif;color:white;
  background:radial-gradient(circle at top,#123d70,#050914 65%);
}
.container{
  width:100%;max-width:430px;padding:28px;
  border:1px solid #18cfff;border-radius:20px;
  background:#081426ef;box-shadow:0 0 28px #00bfff55;
  text-align:center;
}
h1{color:#43d9ff;text-shadow:0 0 12px #00bfff}
p{color:#c5d9ec}
.choices{display:grid;gap:14px;margin-top:24px}
button{
  width:100%;padding:15px;border:1px solid #20cfff;
  border-radius:12px;background:#0c2944;color:white;
  font-size:17px;font-weight:bold;cursor:pointer;
}
button:hover{background:#07517b;box-shadow:0 0 15px #00cfff}
input{
  width:100%;padding:13px;margin:8px 0;
  border:1px solid #20cfff;border-radius:9px;
  background:#06101f;color:white;font-size:16px;
}
.panel{display:none;margin-top:20px}
.small{font-size:13px;color:#a8bed4}
</style>
</head>
<body>
<div class="container">
  <h1>HỒNG QUÂN</h1>
  <p>Chào mừng bạn đến với hệ thống</p>

  <div id="choose" class="choices">
    <button onclick="showUser()">👤 Người dùng</button>
    <button onclick="showAdmin()">🔐 Tài khoản Admin</button>
  </div>

  <div id="user" class="panel">
    <h2>Người dùng</h2>
    <p>Tiếp tục đến trang gửi bài tập.</p>
    <button onclick="location.href='form.html'">
      Vào trang gửi bài
    </button>
    <button onclick="back()">Quay lại</button>
  </div>

  <div id="admin" class="panel">
    <h2>Đăng nhập Admin</h2>
    <input id="adminName" placeholder="Tên tài khoản Admin">
    <input id="adminPass" type="password" placeholder="Mật khẩu">
    <p class="small">
      Cần kết nối xác thực Admin bằng Apps Script
      trước khi sử dụng tài khoản thật.
    </p>
    <button onclick="alert('Chưa kết nối xác thực Admin. Hãy thiết lập Apps Script trước.')">
      Đăng nhập
    </button>
    <button onclick="back()">Quay lại</button>
  </div>
</div>

<script>
function showUser(){
  document.getElementById('choose').style.display='none';
  document.getElementById('user').style.display='block';
}
function showAdmin(){
  document.getElementById('choose').style.display='none';
  document.getElementById('admin').style.display='block';
}
function back(){
  document.getElementById('user').style.display='none';
  document.getElementById('admin').style.display='none';
  document.getElementById('choose').style.display='grid';
}
</script>
</body>
</html>
